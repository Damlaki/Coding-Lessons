<html>
    <head>
        <style>
             div ~ h1,h2 {   
                 background-color: green;
            }
            
        </style>
    </head>

    <body>
        <div>
            <h1>Hi</h1>

            <span>
                <h1>SELAM</h1>
            </span>

        </div>

        <h1>Ahmad</h1>
        <h1>Channel</h1>

        <span>
            <h2>Hello World</h2>
        </span>
         

        <h1>Ahmad DAMLAKHI</h1>
        
    </body>
</html>
