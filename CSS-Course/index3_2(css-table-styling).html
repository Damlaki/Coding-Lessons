<html>
    <head>
        <style>
            table, td, th {
                border:solid 2px black ;
            }
            table {
                border-collapse: collapse;
                width: 50%;
                height: 50%;
                text-align: center;
            }
            td, th {
                vertical-align: top ;
            }

        </style>
        <!--in HTML we call the style = atribiute , in CSS we call it =property-->
    </head>
    <body>
        <table>
            <tr>
                <th>NAME</th>
                <th>AGE</th>
            </tr>

            <tr>
                <td>Ahmad</td>
                <td>20</td>
            </tr>
        </table>
    </body>
</html>
