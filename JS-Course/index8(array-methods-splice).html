<html>
    <head>
        <style>
            #students {
                font-size: 30;
            }
        </style>
    </head>
    <body>
        <p id="students"></p>
    </body>
    <script>
        var students = ["Yaroub","Kahlid","Mohammad","Omar","Sami"]
        document.getElementById("students").innerHTML = students

        
         // splice : ابتحذف الا اندكس وكل الي بعدهم student.splice(3)
         // student.splice(3,1) means that it will remove index num 3 and only one 
        console.log(students.toString());
        students.splice(2,0,"Ali") // add Ali after index 2 , 0 means dont remove anything 
        console.log(students.toString());
        
    </script>
</html>
