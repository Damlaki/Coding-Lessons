<html>
    <head>
        <style>
            h1::before{
                content: '⌛';
            }

            h1::after {
                content: ':';
            }
        </style>
    </head>

    <body>
        <h1>Ahmad Channel</h1>
        <h1>Hi</h1>
        <h1>Hello</h1>
    </body>
</html>
